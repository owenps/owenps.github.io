{{- $name := .Get "name" -}}
{{- $handle := .Get "handle" -}}
{{- $id := printf "social-tooltip-%d" .Ordinal -}}
<a class="social-link" href="{{ .Get "url" }}" aria-label="{{ $name }}"{{ if $handle }} aria-describedby="{{ $id }}"{{ end }}>
  <img class="site-icon" src="{{ printf "images/favicons/%s" (.Get "icon") | relURL }}" alt="" width="24" height="24">
  {{ if $handle }}<span class="social-tooltip glass-surface" id="{{ $id }}" role="tooltip">{{ $handle }}</span>{{ end }}
</a>
