<button class="scroll-to-top" type="button" aria-label="Scroll to top" aria-hidden="true" tabindex="-1">↑</button>
<script>
  (function() {
    var toggle = document.querySelector(".theme-toggle");
    if (!toggle) return;
    var root = document.documentElement;
    var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    function updateGhchart(theme) {
      var chart = document.getElementById("ghchart");
      if (!chart) return;
      var color = theme === "dark" ? "91aab5" : "426477";
      chart.src = "https://ghchart.rshah.org/" + color + "/owenps";
    }
    function updateIcon() {
      var theme = document.documentElement.getAttribute("data-theme");
      toggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
      toggle.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      updateGhchart(theme);
    }
    updateIcon();
    function applyTheme(theme) {
      root.setAttribute("data-theme", theme);
      localStorage.setItem("theme", theme);
      updateIcon();
    }
    var refreshTimer;
    toggle.addEventListener("click", function() {
      var current = root.getAttribute("data-theme");
      var next = current === "dark" ? "light" : "dark";
      applyTheme(next);

      if (reducedMotion.matches) return;

      root.classList.remove("theme-refreshing");
      void root.offsetWidth;
      root.classList.add("theme-refreshing");
      window.clearTimeout(refreshTimer);
      refreshTimer = window.setTimeout(function() {
        root.classList.remove("theme-refreshing");
      }, 340);
    });
  })();

  (function() {
    var button = document.querySelector(".scroll-to-top");
    if (!button) return;
    var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    function update() {
      var visible = window.scrollY > window.innerHeight;
      button.classList.toggle("visible", visible);
      button.setAttribute("aria-hidden", visible ? "false" : "true");
      button.tabIndex = visible ? 0 : -1;
    }

    button.addEventListener("click", function() {
      window.scrollTo({ top: 0, behavior: reducedMotion.matches ? "auto" : "smooth" });
    });
    window.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update);
    update();
  })();

  (function() {
    var annotations = document.querySelectorAll(".annotated-mark");
    if (!annotations.length) return;
    var active;

    function close() {
      if (!active) return;
      active.querySelector(".mark-note").hidden = true;
      active = null;
    }

    function position() {
      if (!active) return;
      var mark = active.querySelector("mark");
      var note = active.querySelector(".mark-note");
      var rect = mark.getBoundingClientRect();
      var left = Math.max(16, Math.min(rect.left, document.documentElement.clientWidth - note.offsetWidth - 16));
      var top = rect.bottom;
      if (top + note.offsetHeight > window.innerHeight - 16) {
        top = rect.top - note.offsetHeight;
      }
      top = Math.max(16, Math.min(top, window.innerHeight - note.offsetHeight - 16));
      note.style.left = left + "px";
      note.style.top = top + "px";
    }

    function open(annotation) {
      if (active !== annotation) close();
      active = annotation;
      active.querySelector(".mark-note").hidden = false;
      position();
    }

    annotations.forEach(function(annotation) {
      annotation.addEventListener("pointerenter", function(event) {
        if (event.pointerType === "mouse") open(annotation);
      });
      annotation.addEventListener("pointerleave", function() {
        if (active === annotation && !annotation.contains(document.activeElement)) close();
      });
      annotation.addEventListener("focusin", function() { open(annotation); });
      annotation.addEventListener("focusout", function(event) {
        if (active === annotation && !annotation.contains(event.relatedTarget)) close();
      });
      annotation.querySelector("mark").addEventListener("click", function(event) {
        if (!event.target.closest("a")) open(annotation);
      });
    });

    document.addEventListener("click", function(event) {
      if (active && !active.contains(event.target)) close();
    });
    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape" && active) {
        close();
        event.preventDefault();
      }
    });
    window.addEventListener("resize", position);
    window.addEventListener("scroll", position, { passive: true });
  })();

</script>
