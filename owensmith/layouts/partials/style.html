<link rel="preload" href="/fonts/GeistPixel-Square.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Geist Pixel Square";
    src: url("/fonts/GeistPixel-Square.woff2") format("woff2");
    font-display: optional;
  }

  @font-face {
    font-family: "DepartureMono";
    src: url("/fonts/DepartureMono_Regular.woff") format("woff");
    font-display: optional;
  }

  :root {
    --width: 720px;
    --font-main: "Geist Pixel Square", monospace;
    --font-secondary: "Geist Pixel Square", monospace;
    --font-code: "DepartureMono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    --font-scale: 1em;
    --background-color: #e9e8e1;
    --heading-color: #20211f;
    --text-color: #454641;
    --link-color: #426477;
    --visited-color: #6c6174;
    --blockquote-color: #30312e;
    --paper-mottle-color: rgba(39, 40, 36, 0.08);
    --paper-texture-blend: multiply;
    --paper-texture-opacity: 0.55;
    --portrait-filter: contrast(0.94);
    --title-sprite-filter: none;
  }

  html {
    background-color: var(--background-color);
    isolation: isolate;
    min-height: 100%;
    scrollbar-gutter: stable;
    transition: background-color 0.16s steps(2, end);
  }

  html::before {
    background-image:
      radial-gradient(ellipse at 12% 18%, var(--paper-mottle-color), transparent 42%),
      radial-gradient(ellipse at 82% 76%, var(--paper-mottle-color), transparent 46%),
      url("/images/eink-grain.svg");
    background-position: center, center, center;
    background-repeat: no-repeat;
    background-size: 100% 100%, 100% 100%, cover;
    content: "";
    inset: 0;
    mix-blend-mode: var(--paper-texture-blend);
    opacity: var(--paper-texture-opacity);
    pointer-events: none;
    position: fixed;
    z-index: 0;
  }

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    margin: auto;
    padding: 20px;
    max-width: var(--width);
    text-align: left;
    background-color: transparent;
    position: relative;
    z-index: 1;
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.5;
    color: var(--text-color);
    transition: color 0.16s steps(2, end);
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
    transition: color 0.16s steps(2, end);
  }

  a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: none;
    transition: color 0.16s steps(2, end);
  }

  a:not(.title):hover {
    background-color: var(--heading-color);
    box-shadow: 0.14em 0 0 var(--heading-color), -0.14em 0 0 var(--heading-color);
    color: var(--background-color);
    text-decoration: none;
  }

  ::selection {
    background-color: var(--heading-color);
    color: var(--background-color);
  }

  a[href^="http://"]::after,
  a[href^="https://"]::after {
    content: "\00a0↗";
    display: inline-block;
    font-family: var(--font-code);
    font-size: 0.78em;
    line-height: 1;
    text-decoration: none;
    vertical-align: 0.08em;
  }

  nav a {
    margin-right: 8px;
  }

  strong,
  b {
    color: var(--heading-color);
    transition: color 0.16s steps(2, end);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  time {
    font-family: monospace;
    font-style: normal;
    font-size: 15px;
  }

  main {
    line-height: 1.6;
  }

  table {
    width: 100%;
  }

  hr {
    border: 0;
    border-top: 1px dashed;
  }

  img {
    max-width: 100%;
  }

  .site-favicon {
    border-radius: 2px;
    display: inline-block;
    height: 1em;
    margin-right: 0.45em;
    object-fit: contain;
    vertical-align: -0.125em;
    width: 1em;
  }

  .home-portrait {
    border: 2px solid var(--text-color);
    box-sizing: border-box;
    display: block;
    filter: var(--portrait-filter);
    height: auto;
    margin: 1.5em 0;
    transition: border-color 0.16s steps(2, end), filter 0.16s steps(2, end);
    width: 20%;
  }

  code {
    font-family: var(--font-code);
  }

  blockquote {
    border-left: 3px solid #999;
    color: var(--blockquote-color);
    font-style: italic;
    margin-inline: 0;
    padding-left: 20px;
    transition: border-color 0.16s steps(2, end), color 0.16s steps(2, end);
  }

  footer {
    padding: 25px 0;
    text-align: center;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .title:hover {
    text-decoration: none;
  }

  .title h1 {
    font-size: 1.5em;
  }

  .title h2 {
    margin: 0;
  }


  .inline {
    width: auto !important;
  }

  .highlight,
  .code {
    border-radius: 0;
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
    font-size: 0.9em;
  }

  .highlight pre {
    padding: 1em 1.2em;
    margin: 0;
    border-radius: 0;
  }

  .codeblock {
    margin-block-start: 1em;
    margin-block-end: 1em;
  }

  .codeblock .highlight,
  .codeblock pre {
    margin: 0;
    background-color: #101418 !important;
  }

  .codeblock pre {
    border-radius: 0;
    font-family: var(--font-code);
    overflow-x: auto;
    padding: 1em 1.2em;
  }

  .codeblock pre,
  .codeblock code {
    background-color: #101418 !important;
    color: #d6deeb !important;
  }

  code {
    font-size: 0.9em;
  }

  :not(pre) > code {
    background-color: rgba(0, 0, 0, 0.1);
    padding: 0.2em 0.4em;
    border-radius: 4px;
  }

  .scroll-to-top {
    align-items: center;
    background: var(--background-color);
    border: 1px solid var(--text-color);
    border-radius: 50%;
    bottom: 1.25rem;
    color: var(--text-color);
    display: flex;
    font-family: var(--font-code);
    font-size: 1rem;
    height: 2.5rem;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    position: fixed;
    right: max(1rem, calc((100vw - var(--width)) / 2 - 3.5rem));
    transform: translateY(0.5rem);
    transition: background-color 0.16s steps(2, end), border-color 0.16s steps(2, end), color 0.16s steps(2, end), opacity 0.15s ease, transform 0.15s ease;
    width: 2.5rem;
    z-index: 10;
  }

  .scroll-to-top.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .scroll-to-top.visible:hover {
    transform: translateY(-2px);
  }

  /* blog post list */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    flex: 0 0 130px;
  }

  ul.blog-posts li a:visited {
    color: var(--visited-color);
  }

  .title-sprite {
    display: inline;
    filter: var(--title-sprite-filter);
    height: 2em;
    opacity: 0.88;
    vertical-align: middle;
  }

  @media (prefers-reduced-motion: reduce) {
    html,
    body,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    a,
    strong,
    b,
    blockquote,
    .home-portrait,
    .scroll-to-top {
      transition: none;
    }
  }
</style>
