<style>
  html[data-theme="light"] {
    --background-color: #e9e8e1;
    --heading-color: #20211f;
    --text-color: #454641;
    --link-color: #426477;
    --visited-color: #6c6174;
    --blockquote-color: #30312e;
    --paper-mottle-color: rgba(39, 40, 36, 0.08);
    --paper-texture-blend: multiply;
    --paper-texture-opacity: 0.55;
    --portrait-filter: contrast(0.94);
    --title-sprite-filter: none;
  }

  html[data-theme="dark"] {
    --background-color: #20211f;
    --heading-color: #e3e4dd;
    --text-color: #c4c5bf;
    --link-color: #91aab5;
    --visited-color: #a59aaa;
    --blockquote-color: #d2d3cc;
    --paper-mottle-color: rgba(215, 216, 207, 0.07);
    --paper-texture-blend: soft-light;
    --paper-texture-opacity: 0.46;
    --portrait-filter: brightness(0.72) contrast(0.94);
    --title-sprite-filter: invert(1);
  }

  html::after {
    background: var(--heading-color);
    content: "";
    inset: 0;
    opacity: 0;
    pointer-events: none;
    position: fixed;
    z-index: 2147483647;
  }

  html.theme-refreshing::after {
    animation: eink-refresh 0.24s steps(1, end) 0.1s;
  }

  @keyframes eink-refresh {
    0% { opacity: 0; }
    12% { opacity: 0.28; }
    34% { opacity: 0.06; }
    52% { opacity: 0.18; }
    72% { opacity: 0.03; }
    100% { opacity: 0; }
  }

  .theme-toggle {
    align-items: center;
    background: color-mix(in srgb, var(--background-color) 92%, var(--text-color));
    border: 2px solid var(--text-color);
    border-radius: 0;
    box-sizing: border-box;
    color: var(--heading-color);
    cursor: pointer;
    display: inline-flex;
    flex: 0 0 40px;
    height: 40px;
    justify-content: center;
    padding: 0;
    transition: background-color 0.12s steps(2, end), border-color 0.16s steps(2, end), color 0.12s steps(2, end);
    width: 40px;
  }

  @media (hover: hover) {
    .theme-toggle:hover {
      background: color-mix(in srgb, var(--background-color) 82%, var(--text-color));
    }
  }

  .theme-toggle:active {
    background: color-mix(in srgb, var(--background-color) 70%, var(--text-color));
  }

  .theme-toggle:focus-visible {
    outline: 2px solid var(--link-color);
    outline-offset: 2px;
  }

  .theme-sun-icon {
    display: block;
    flex: none;
    height: 21px;
    overflow: visible;
    width: 21px;
  }

  @media (prefers-reduced-motion: reduce) {
    html.theme-refreshing::after {
      animation: none;
    }

    .theme-toggle {
      transition: none;
    }
  }
</style>
<script>
  (function() {
    var saved = localStorage.getItem("theme");
    if (saved) {
      document.documentElement.setAttribute("data-theme", saved);
    } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
      document.documentElement.setAttribute("data-theme", "dark");
    } else {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>
