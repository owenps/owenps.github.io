<style>
  html[data-theme="light"] {
    --background-color: #f5f0e8;
    --heading-color: #2a2420;
    --text-color: #4a4440;
    --link-color: #3273dc;
    --visited-color: #8b6fcb;
    --blockquote-color: #2a2420;
  }

  html[data-theme="dark"] {
    --background-color: #01242e;
    --heading-color: #eee;
    --text-color: #ddd;
    --link-color: #8cc2dd;
    --visited-color: #8b6fcb;
    --blockquote-color: #ccc;
  }

  .theme-toggle {
    align-items: center;
    background: transparent;
    border: 0;
    border-radius: 50%;
    color: var(--text-color);
    cursor: pointer;
    display: inline-flex;
    height: 40px;
    justify-content: center;
    padding: 0;
    transition: background-color 0.15s ease;
    width: 40px;
  }

  .theme-toggle:hover {
    background: color-mix(in srgb, var(--text-color) 9%, transparent);
  }

  .theme-toggle:focus-visible {
    outline: 2px solid var(--link-color);
    outline-offset: 2px;
  }

  .theme-sun-moon {
    height: 21px;
    overflow: visible;
    width: 21px;
  }

  .theme-sun,
  .theme-moon {
    transform-box: fill-box;
    transform-origin: center;
    transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .theme-sun {
    color: var(--link-color);
    opacity: 1;
    transform: rotate(0) scale(1);
  }

  .theme-moon {
    color: #f2e7cf;
    opacity: 0;
    transform: rotate(-70deg) scale(0.65);
  }

  html[data-theme="dark"] .theme-sun {
    opacity: 0;
    transform: rotate(70deg) scale(0.65);
  }

  html[data-theme="dark"] .theme-moon {
    opacity: 1;
    transform: rotate(0) scale(1);
  }

  @media (prefers-reduced-motion: reduce) {
    .theme-toggle,
    .theme-sun,
    .theme-moon {
      transition: none;
    }
  }
</style>
<script>
  (function() {
    var saved = localStorage.getItem("theme");
    if (saved) {
      document.documentElement.setAttribute("data-theme", saved);
    } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
      document.documentElement.setAttribute("data-theme", "dark");
    } else {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>
