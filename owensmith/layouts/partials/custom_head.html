{{ end }}
{{ if .HasShortcode "scramble-text" }}

{{ if .HasShortcode "hover-card" }}
<link rel="stylesheet" href="{{ "css/hover-card.css" | relURL }}">
<script type="module" src="{{ "js/hover-card.js" | relURL }}"></script>
{{ end }}
<style>
  @font-face {
    font-family: "Geist";
    src: url('{{ "fonts/GeistVariable.woff2" | relURL }}') format("woff2");
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
  }

  @font-face {
    font-family: "Geist";
    src: url('{{ "fonts/GeistVariable-Italic.woff2" | relURL }}') format("woff2");
    font-style: italic;
    font-weight: 100 900;
    font-display: swap;
  }

  @font-face {
    font-family: "Geist Mono";
    src: url('{{ "fonts/GeistMonoVariable.woff2" | relURL }}') format("woff2");
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
  }

  @font-face {
    font-family: "Geist Mono";
    src: url('{{ "fonts/GeistMonoVariable-Italic.woff2" | relURL }}') format("woff2");
    font-style: italic;
    font-weight: 100 900;
    font-display: swap;
  }

  .blog-prose {
    display: block;
    line-height: 1.8;
  }

  :root {
    --font-main: "Geist", sans-serif;
    --font-secondary: "Geist", sans-serif;
    color-scheme: light;
    --background-color: #ffffff;
    --heading-color: #222222;
    --text-color: #444444;
    --link-color: #2865c4;
    --visited-color: #7655a3;
    --surface-color: #f5f5f5;
    --muted-color: #666666;
    --border-color: #dedede;
    --mark-color: #e8f0ff;
    --heart-color: #bb304d;
    --blockquote-color: var(--text-color);
  }

  /* System preference remains the fallback when JavaScript is unavailable. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --background-color: #191919;
      --heading-color: #eeeeee;
      --text-color: #c9c9c9;
      --link-color: #98baff;
      --visited-color: #b2a5d6;
      --surface-color: #242424;
      --muted-color: #999999;
      --border-color: #3b3b3b;
      --mark-color: #29364d;
      --heart-color: #ff8194;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --background-color: #191919;
    --heading-color: #eeeeee;
    --text-color: #c9c9c9;
    --link-color: #98baff;
    --visited-color: #b2a5d6;
    --surface-color: #242424;
    --muted-color: #999999;
    --border-color: #3b3b3b;
    --mark-color: #29364d;
    --heart-color: #ff8194;
  }

  hr,
  blockquote {
    border-color: var(--border-color);
  }

  pre,
  code {
    font-family: "Geist Mono", monospace;
  }

  /* Fenced code retains its self-contained Nord syntax palette. */
  :not(pre) > code {
    background: var(--surface-color);
    color: var(--heading-color);
  }

  mark {
    background: var(--mark-color);
    color: var(--heading-color);
  }

  :focus-visible {
    outline: 2px solid var(--link-color);
    outline-offset: 4px;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: calc(100vh - 40px);
    min-height: calc(100dvh - 40px);
    text-wrap: pretty;
  }

  h1, h2, h3, h4, h5, h6 {
    text-wrap: wrap;
  }

  footer {
    align-items: center;
    display: flex;
    justify-content: space-between;
    font-size: 0.875em;
    margin-top: auto;
    color: var(--muted-color);
    text-align: left;
  }

  a[href^="http://"]::after,
  a[href^="https://"]::after,
  a[href^="mailto:"]::after {
    content: "↗";
    display: inline-block;
    margin-left: 0.5em;
    text-decoration: none;
    white-space: nowrap;
  }

  .footer-source {
    color: inherit;
  }

  .site-icon {
    background-color: color-mix(in srgb, var(--text-color) 10%, var(--background-color));
    border-radius: 4px;
    display: inline-block;
    height: 16px;
    object-fit: contain;
    vertical-align: -0.125em;
    width: 16px;
  }

  footer a.footer-source::after {
    content: none;
  }

  /* Support annotated content without overriding the theme. */
  .annotated-mark {
    padding-block: 0.3em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }

  .annotated-mark > mark {
    cursor: help;
    text-decoration: underline dotted;
    text-underline-offset: 0.2em;
  }

  .annotated-mark > mark:focus-visible {
    outline: 2px solid var(--link-color);
    outline-offset: 2px;
  }

  .mark-note {
    background-color: var(--background-color);
    border: 1px solid var(--link-color);
    box-sizing: border-box;
    color: var(--text-color);
    font-size: 0.9rem;
    font-style: normal;
    font-weight: normal;
    line-height: 1.5;
    max-height: 50vh;
    overflow-y: auto;
    padding: 0.65rem 0.8rem;
    position: fixed;
    text-align: left;
    white-space: pre-wrap;
    width: min(20rem, calc(100vw - 32px));
    z-index: 20;
  }
</style>
<link rel="stylesheet" href="{{ "css/glass.css" | relURL }}">
<link rel="stylesheet" href="{{ "css/header.css" | relURL }}">
{{ $themeToggleCSS := resources.FromString "css/theme-toggle.css" (readFile "static/css/theme-toggle.css") | fingerprint }}
<link rel="stylesheet" href="{{ $themeToggleCSS.RelPermalink }}">
<script src="{{ "js/theme-toggle.js" | relURL }}"></script>
<link rel="stylesheet" href="{{ "css/floating-nav.css" | relURL }}">
<script defer src="{{ "js/floating-nav.js" | relURL }}"></script>
{{ if .Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" integrity="sha384-zh0CIslj+VczCZtlzBcjt5ppRcsAmDnRem7ESsYwWwg3m/OaJ2l4x7YBZl9Kxxib" crossorigin="anonymous">
{{ end }}
