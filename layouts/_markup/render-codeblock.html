{{- $options := dict -}}
{{- if not (transform.CanHighlight .Type) -}}
  {{- $options = dict "type" "text" -}}
{{- end -}}
{{- $highlighted := transform.HighlightCodeBlock . $options -}}
{{- $copy := eq (printf "%v" .Attributes.copy) "true" -}}
<div class="code-block">
  {{- if $copy }}
    <div class="code-copy" data-copy="{{ .Inner }}">
      <span class="copy-status" role="status"></span>
      <button class="copy-button" type="button" aria-label="Copy code" disabled><span class="code-copy-label">Copy</span><span class="code-copy-check" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" focusable="false"><path d="M20 6 9 17l-5-5"/></svg></span></button>
    </div>
  {{- end }}
  {{ $highlighted.Wrapped }}
</div>
