{{- $url := .Get "url" -}}
{{- $text := .Get "text" -}}
{{- $icon := .Get "icon" -}}
{{- if not (and $url $text $icon) -}}
  {{- errorf "site-link requires url, text, and icon at %s" .Position -}}
{{- else -}}
  {{- partial "site-link.html" (dict "url" $url "text" $text "icon" $icon) -}}
{{- end -}}
