<section class="guestbook" data-guestbook-messages data-endpoint="{{ "api/guestbook" | relURL }}">
  <p class="guestbook-load-status" role="status"></p>
  <ol class="guestbook-entries" aria-label="Guestbook messages"></ol>
  <button type="button" class="guestbook-older" hidden>Older messages</button>
  <button type="button" class="guestbook-retry" hidden>Try again</button>
  <noscript><p>JavaScript is needed to read the guestbook.</p></noscript>
</section>
