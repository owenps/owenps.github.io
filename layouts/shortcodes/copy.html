{{- $text := .Get 0 -}}
{{- if not $text -}}
  {{- errorf "copy requires text to copy at %s" .Position -}}
{{- else -}}
  <span class="copy-inline" data-copy="{{ $text }}"><button class="copy-button" type="button" aria-label="Copy {{ $text }}" title="Copy to clipboard" disabled><span class="copy-text">{{ $text }}</span><span class="copy-symbols" aria-hidden="true" hidden><svg class="copy-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg><svg class="copy-check" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="m5 12 4 4L19 6"/></svg></span></button><span class="copy-status" role="status"></span></span>
{{- end -}}
